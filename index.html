<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16201A">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fieldline GPS Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
/* Layout: instrument console — plot surface on the left, readout stack on the right, log of tracks below */
:root{
  --bg:#E9EDE8; --panel:#F6F8F5; --fg:#16201A; --muted:#5E6B63; --line:#C9D2CB;
  --grid:#D6DDD7; --accent:#C9440E; --accent-ink:#FFFFFF; --track:#1F5D47; --ok:#2E7D4F; --warn:#B7791F; --bad:#B42318;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --panel:#151D19; --fg:#DCE5DF; --muted:#8C9A92; --line:#26322C;
  --grid:#1E2924; --accent:#FF7A3D; --accent-ink:#1A0E07; --track:#6FD3A8; --ok:#5CC98A; --warn:#E3B04B; --bad:#F27166; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --panel:#151D19; --fg:#DCE5DF; --muted:#8C9A92; --line:#26322C;
  --grid:#1E2924; --accent:#FF7A3D; --accent-ink:#1A0E07; --track:#6FD3A8; --ok:#5CC98A; --warn:#E3B04B; --bad:#F27166; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
h1 span{color:var(--accent)}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill[data-s="live"] .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.pill[data-s="search"] .dot{background:var(--warn)}
.pill[data-s="off"] .dot{background:var(--bad)}
.pill[data-s="demo"] .dot{background:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.plot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:340px;aspect-ratio:4/3;max-width:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.plot-tag{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:12px;color:var(--muted);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.readouts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.ro{padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.ro:nth-child(odd){border-right:1px solid var(--line)}
.ro.wide{grid-column:1/-1;border-right:0}
.ro:last-child,.ro:nth-last-child(2):not(.wide){border-bottom:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.val{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.val small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.ro.wide .val{font-size:46px}
.coord{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;line-height:1.6;word-break:break-all}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:600 14px/1 var(--body);padding:11px 14px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1 1 120px;justify-content:center}
button.rec .rd{width:10px;height:10px;border-radius:50%;background:currentColor}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.note{font-size:13px;color:var(--muted);margin:0}
.note b{color:var(--fg);font-weight:600}
section.log{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.log-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.log-head h2{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.sel td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
td button{padding:6px 9px;font-size:12px}
.tag{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:5px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.pill[data-s="live"] .dot{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.4}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Field<span>line</span> GPS</h1>
      <div class="sub">WGS 84 · track logger</div>
    </div>
    <div class="pill" id="status" data-s="demo"><span class="dot"></span><span id="statusText">Sample track loaded</span></div>
  </header>

  <div class="main">
    <div class="plot">
      <canvas id="cv" aria-label="Track plot"></canvas>
      <div class="plot-tag" id="plotTag">Sample · Greenwich Park loop</div>
    </div>

    <div class="side">
      <div class="readouts">
        <div class="ro wide"><div class="lbl">Distance</div><div class="val" id="rDist">0.00<small>km</small></div></div>
        <div class="ro"><div class="lbl">Moving time</div><div class="val" id="rTime">0:00:00</div></div>
        <div class="ro"><div class="lbl">Speed</div><div class="val" id="rSpd">0.0<small>km/h</small></div></div>
        <div class="ro"><div class="lbl">Avg pace</div><div class="val" id="rPace">–<small>/km</small></div></div>
        <div class="ro"><div class="lbl">Elev gain</div><div class="val" id="rGain">0<small>m</small></div></div>
        <div class="ro wide"><div class="lbl">Position</div>
          <div class="coord" id="rPos">–</div></div>
      </div>
      <div class="controls">
        <button class="primary rec" id="bRec"><span class="rd"></span><span id="bRecT">Start recording</span></button>
        <button id="bStop" disabled>Stop &amp; save</button>
      </div>
      <div class="controls">
        <button id="bDemo">Simulate a walk</button>
        <button id="bCenter">Fit track</button>
      </div>
      <p class="note" id="gpsNote"></p>
    </div>
  </div>

  <section class="log">
    <div class="log-head">
      <h2>Tracks</h2>
      <label class="btn" for="fImp">Import GPX<input type="file" id="fImp" accept=".gpx,application/gpx+xml,text/xml"></label>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Name</th><th>Date</th><th>Distance</th><th>Time</th><th>Points</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const R=6371008.8;
const rad=d=>d*Math.PI/180;
function hav(a,b){const dLa=rad(b.lat-a.lat),dLo=rad(b.lon-a.lon);const s=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s));}

/* ---------- stats ---------- */
function stats(pts){
  let d=0,mv=0,gain=0;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],seg=hav(a,b),dt=(b.t-a.t)/1000;
    d+=seg; if(dt>0&&dt<60&&seg/dt>0.3)mv+=dt;
    if(a.ele!=null&&b.ele!=null&&b.ele>a.ele)gain+=b.ele-a.ele;
  }
  return {d,mv,gain};
}
const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');};
function dm(v,pos,neg){const a=Math.abs(v),d=Math.floor(a),m=(a-d)*60;return d+'° '+m.toFixed(3).padStart(6,'0')+'′ '+(v>=0?pos:neg);}

/* ---------- sample track (synthetic loop, Greenwich) ---------- */
function sample(){
  const c={lat:51.4769,lon:-0.0005},pts=[],t0=Date.UTC(2026,9,25,8,30);
  for(let i=0;i<=160;i++){
    const a=i/160*Math.PI*2,r=380+60*Math.sin(a*3)+25*Math.cos(a*7);
    pts.push({lat:c.lat+r*Math.sin(a)/111320,lon:c.lon+r*Math.cos(a)*1.35/(111320*Math.cos(rad(c.lat))),ele:+(20+18*Math.sin(a+0.6)+4*Math.sin(a*5)).toFixed(1),t:t0+i*11000,acc:5});
  }
  return {id:'sample',name:'Greenwich Park loop',sample:true,pts};
}

/* ---------- storage ---------- */
const KEY='fieldline.tracks.v1';
let saved=[];
try{saved=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){saved=[];}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){toast('Could not save to this browser; export as GPX to keep it.');}}

/* ---------- state ---------- */
const SAMPLE=sample();
let view=SAMPLE;            // track shown on the plot
let rec=null;               // {pts:[], startedAt}
let paused=false, watchId=null, demoTimer=null, last=null, lastSpeed=0, wake=null;

/* ---------- plot ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function nice(x){const p=10**Math.floor(Math.log10(x)),f=x/p;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p;}
function draw(){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height;
  ctx.clearRect(0,0,W,H);
  const pts=(rec?rec.pts:view?view.pts:[]);
  const here=last;
  const all=pts.length?pts:(here?[here]:[]);
  ctx.font='11px '+css('--mono');
  if(!all.length){ctx.fillStyle=css('--muted');ctx.textAlign='center';ctx.fillText('Waiting for a position fix',W/2,H/2);return;}
  let la0=Infinity,la1=-Infinity,lo0=Infinity,lo1=-Infinity;
  for(const p of all){la0=Math.min(la0,p.lat);la1=Math.max(la1,p.lat);lo0=Math.min(lo0,p.lon);lo1=Math.max(lo1,p.lon);}
  if(here&&rec){la0=Math.min(la0,here.lat);la1=Math.max(la1,here.lat);lo0=Math.min(lo0,here.lon);lo1=Math.max(lo1,here.lon);}
  const cLat=(la0+la1)/2,cLon=(lo0+lo1)/2,kx=111320*Math.cos(rad(cLat)),ky=110574;
  const spanX=Math.max((lo1-lo0)*kx,80),spanY=Math.max((la1-la0)*ky,80);
  const pad=40,s=Math.min((W-pad*2)/spanX,(H-pad*2-20)/spanY);
  const X=lon=>W/2+(lon-cLon)*kx*s, Y=lat=>H/2+8-(lat-cLat)*ky*s;
  // grid
  const step=nice(90/s);
  ctx.strokeStyle=css('--grid');ctx.lineWidth=1;ctx.beginPath();
  const gx0=Math.floor(((0-W/2)/s)/step)*step;
  for(let m=gx0;W/2+m*s<W;m+=step){const x=Math.round(W/2+m*s)+.5;ctx.moveTo(x,0);ctx.lineTo(x,H);}
  const gy0=Math.floor(((0-H/2)/s)/step)*step;
  for(let m=gy0;H/2+m*s<H;m+=step){const y=Math.round(H/2+8+m*s)+.5;ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
  // track
  if(pts.length>1){
    ctx.strokeStyle=css('--track');ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(X(p.lon),Y(p.lat)):ctx.moveTo(X(p.lon),Y(p.lat)));ctx.stroke();
    // start marker
    const a=pts[0];ctx.fillStyle=css('--panel');ctx.strokeStyle=css('--track');ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(X(a.lon),Y(a.lat),5,0,7);ctx.fill();ctx.stroke();
  }
  // current / end marker
  const cur=(rec&&here)?here:pts[pts.length-1];
  if(cur){
    const cx=X(cur.lon),cy=Y(cur.lat);
    if(cur.acc&&rec){ctx.fillStyle=css('--accent');ctx.globalAlpha=.14;ctx.beginPath();ctx.arc(cx,cy,Math.max(cur.acc*s,8),0,7);ctx.fill();ctx.globalAlpha=1;}
    ctx.fillStyle=css('--accent');ctx.strokeStyle=css('--panel');ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(cx,cy,7,0,7);ctx.fill();ctx.stroke();
  }
  // scale bar
  const sb=nice(W*0.22/s),len=sb*s,bx=14,by=H-16;
  ctx.strokeStyle=css('--fg');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by-5);ctx.lineTo(bx,by);ctx.lineTo(bx+len,by);ctx.lineTo(bx+len,by-5);ctx.stroke();
  ctx.fillStyle=css('--fg');ctx.textAlign='left';ctx.fillText(sb>=1000?(sb/1000)+' km':sb+' m',bx+len+8,by+1);
  // north arrow
  const nx=W-24,ny=H-30;ctx.fillStyle=css('--fg');ctx.beginPath();ctx.moveTo(nx,ny-14);ctx.lineTo(nx+6,ny+4);ctx.lineTo(nx,ny);ctx.lineTo(nx-6,ny+4);ctx.closePath();ctx.fill();
  ctx.textAlign='center';ctx.fillText('N',nx,ny+18);
}
new ResizeObserver(draw).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- readouts ---------- */
function readouts(){
  const pts=rec?rec.pts:view?view.pts:[];
  const st=stats(pts);
  $('rDist').innerHTML=(st.d/1000).toFixed(2)+'<small>km</small>';
  $('rTime').textContent=fmtT(st.mv);
  const spd=rec?lastSpeed*3.6:(st.mv?st.d/st.mv*3.6:0);
  $('rSpd').innerHTML=spd.toFixed(1)+'<small>km/h</small>';
  const pace=st.d>50?st.mv/(st.d/1000):0;
  $('rPace').innerHTML=(pace?Math.floor(pace/60)+':'+String(Math.round(pace%60)).padStart(2,'0'):'–')+'<small>/km</small>';
  $('rGain').innerHTML=Math.round(st.gain)+'<small>m</small>';
  const p=(rec&&last)?last:pts[pts.length-1];
  $('rPos').innerHTML=p?(dm(p.lat,'N','S')+'&nbsp;&nbsp;'+dm(p.lon,'E','W')+'<br>'+p.lat.toFixed(6)+', '+p.lon.toFixed(6)+
    (p.ele!=null?' · '+Math.round(p.ele)+' m':'')+(p.acc?' · ±'+Math.round(p.acc)+' m':'')):'–';
}
function refresh(){readouts();draw();}

/* ---------- status ---------- */
function status(s,t){$('status').dataset.s=s;$('statusText').textContent=t;}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,3200);}

/* ---------- position handling ---------- */
function onFix(p){
  last=p;
  if(p.spd!=null&&!isNaN(p.spd))lastSpeed=p.spd;
  if(rec&&!paused){
    const prev=rec.pts[rec.pts.length-1];
    if(p.acc>60){status('search','Weak fix ±'+Math.round(p.acc)+' m');refresh();return;}
    if(!prev||hav(prev,p)>=Math.max(3,p.acc*0.4)){
      if(prev&&(p.spd==null||isNaN(p.spd))){const dt=(p.t-prev.t)/1000;lastSpeed=dt>0?hav(prev,p)/dt:0;}
      rec.pts.push(p);
    }
  }
  refresh();
}
function startGPS(){
  if(!('geolocation' in navigator)){gpsFail('This browser has no location support.');return false;}
  status('search','Searching for satellites');
  watchId=navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords;
    status('live','Live · ±'+Math.round(c.accuracy)+' m');
    onFix({lat:c.latitude,lon:c.longitude,ele:c.altitude,acc:c.accuracy,spd:c.speed,t:pos.timestamp});
  },err=>{
    gpsFail(err.code===1?'Location access was refused here.':'No position fix yet ('+err.message+').');
  },{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  return true;
}
function gpsFail(msg){
  stopWatch();
  status('off','No GPS');
  $('gpsNote').innerHTML='<b>'+msg+'</b> Live tracking needs a page served over HTTPS with location permission, for example this file on GitHub Pages. Use <b>Simulate a walk</b> to try the logger here.';
  if(rec&&!rec.pts.length){rec=null;setButtons();refresh();}
}
function stopWatch(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}if(demoTimer){clearInterval(demoTimer);demoTimer=null;}}

/* ---------- demo feed ---------- */
function startDemo(){
  const base=SAMPLE.pts;let i=0;const t0=Date.now();
  status('demo','Simulated feed · 10× speed');
  demoTimer=setInterval(()=>{
    if(i>=base.length){stopRec();return;}
    const b=base[i];
    onFix({lat:b.lat+(Math.random()-.5)*2e-5,lon:b.lon+(Math.random()-.5)*2e-5,ele:b.ele,acc:4+Math.random()*4,spd:null,t:t0+i*11000});
    i++;
  },1100);
}

/* ---------- recording ---------- */
async function lockScreen(){try{wake=await navigator.wakeLock?.request('screen');}catch(e){wake=null;}}
function startRec(demo){
  rec={pts:[],startedAt:Date.now(),demo};paused=false;last=null;lastSpeed=0;
  $('gpsNote').textContent='';
  if(demo)startDemo();else if(!startGPS())return;
  $('plotTag').textContent=demo?'Recording · simulated walk':'Recording';
  lockScreen();setButtons();refresh();
}
function togglePause(){paused=!paused;$('plotTag').textContent=paused?'Paused':'Recording';setButtons();}
function stopRec(){
  stopWatch();try{wake?.release();}catch(e){}wake=null;
  const r=rec;rec=null;paused=false;
  if(r&&r.pts.length>1){
    const d=new Date(r.startedAt);
    const t={id:'t'+r.startedAt,name:(r.demo?'Simulated walk ':'Track ')+d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}),pts:r.pts.map(p=>({lat:+p.lat.toFixed(7),lon:+p.lon.toFixed(7),ele:p.ele==null?null:+(+p.ele).toFixed(1),t:p.t}))};
    saved.unshift(t);persist();view=t;toast('Saved '+t.name);
  }else if(r){toast('Too few points to save.');}
  status(view.sample?'demo':'search',view.sample?'Sample track loaded':'Idle');
  $('plotTag').textContent=(view.sample?'Sample · ':'')+view.name;
  setButtons();renderList();refresh();
}
function setButtons(){
  const on=!!rec;
  $('bRecT').textContent=!on?'Start recording':paused?'Resume':'Pause';
  $('bStop').disabled=!on;$('bDemo').disabled=on;
}
$('bRec').onclick=()=>{if(!rec)startRec(false);else togglePause();};
$('bStop').onclick=stopRec;
$('bDemo').onclick=()=>startRec(true);
$('bCenter').onclick=draw;

/* ---------- GPX ---------- */
function toGPX(t){
  const esc=s=>s.replace(/[<&>"]/g,c=>({'<':'&lt;','&':'&amp;','>':'&gt;','"':'&quot;'}[c]));
  const pts=t.pts.map(p=>`      <trkpt lat="${p.lat}" lon="${p.lon}">${p.ele!=null?`<ele>${p.ele}</ele>`:''}${p.t?`<time>${new Date(p.t).toISOString()}</time>`:''}</trkpt>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Fieldline GPS" xmlns="http://www.topografix.com/GPX/1/1">\n  <trk><name>${esc(t.name)}</name>\n    <trkseg>\n${pts}\n    </trkseg>\n  </trk>\n</gpx>\n`;
}
let downloads=null;
(async()=>{try{downloads=await window.claude?.use?.('downloads');}catch(e){downloads=null;}})();
async function exportGPX(t){
  const name=t.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')+'.gpx',data=toGPX(t);
  if(downloads){try{await downloads.save({filename:name,data});toast('Exported '+name);}catch(e){toast('Export cancelled.');}return;}
  if(window.claude){toast('Downloads are not available in this view.');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/gpx+xml'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('fImp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const doc=new DOMParser().parseFromString(await f.text(),'application/xml');
    const nodes=[...doc.getElementsByTagName('trkpt'),...doc.getElementsByTagName('rtept')];
    const pts=nodes.map(n=>{const ele=n.getElementsByTagName('ele')[0],tm=n.getElementsByTagName('time')[0];
      return {lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),ele:ele?+ele.textContent:null,t:tm?Date.parse(tm.textContent):0};}).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
    if(pts.length<2)throw new Error('no points');
    const nm=doc.getElementsByTagName('name')[0]?.textContent?.trim()||f.name.replace(/\.gpx$/i,'');
    const t={id:'i'+Date.now(),name:nm,pts};saved.unshift(t);persist();view=t;
    $('plotTag').textContent=t.name;status('search','Idle');renderList();refresh();toast('Imported '+pts.length+' points');
  }catch(err){toast('That file has no GPX track points.');}
  e.target.value='';
};

/* ---------- list ---------- */
function renderList(){
  const tb=$('tbody');tb.textContent='';
  const rows=[...saved,SAMPLE];
  for(const t of rows){
    const st=stats(t.pts),tr=document.createElement('tr');if(view===t)tr.className='sel';
    const td=(txt,cls)=>{const c=document.createElement('td');if(cls)c.className=cls;c.textContent=txt;tr.appendChild(c);return c;};
    const nm=td(t.name);if(t.sample){const s=document.createElement('span');s.className='tag';s.textContent='sample';nm.appendChild(s);}
    td(t.pts[0].t?new Date(t.pts[0].t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'–','n');
    td((st.d/1000).toFixed(2)+' km','n');td(fmtT(st.mv),'n');td(String(t.pts.length),'n');
    const act=document.createElement('td');
    const mk=(lbl,fn)=>{const b=document.createElement('button');b.textContent=lbl;b.onclick=fn;act.appendChild(b);act.append(' ');};
    mk('View',()=>{if(rec)return toast('Stop recording first.');view=t;$('plotTag').textContent=(t.sample?'Sample · ':'')+t.name;renderList();refresh();});
    mk('GPX',()=>exportGPX(t));
    if(!t.sample)mk(t._confirm?'Confirm delete':'Delete',()=>{
      if(!t._confirm){t._confirm=true;renderList();setTimeout(()=>{t._confirm=false;renderList();},3000);return;}
      saved=saved.filter(x=>x!==t);persist();if(view===t)view=SAMPLE;renderList();refresh();
    });
    tr.appendChild(act);tb.appendChild(tr);
  }
}

$('gpsNote').innerHTML='Start recording to log your position. Live GPS needs location permission; <b>Simulate a walk</b> runs the logger on a sample route.';
setButtons();renderList();refresh();
})();
</script>
